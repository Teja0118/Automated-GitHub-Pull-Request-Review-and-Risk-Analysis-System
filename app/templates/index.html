<!DOCTYPE html>
<html>
<head>
    <title>PR Risk Analysis</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Automated GitHub Pull Request Review & Risk Analysis</h1>
    <p class="subtitle">
        ML-driven PR risk prediction with AST analysis and LLM-based review suggestions
    </p>

    <section class="card">
        <h2>Predict Pull Request Risk</h2>

        <div class="actions">
            <button onclick="analyzeLatest()">Analyze Latest PR</button>
        </div>

        <div class="actions">
            <input
                type="text"
                id="prNumber"
                placeholder="Enter PR number"
                inputmode="numeric"
                pattern="[0-9]*"
                oninput="allowOnlyNumbers(this)"
            />

            <button onclick="analyzePR()">Analyze PR</button>
        </div>
    </section>

    <section class="card">
        <h2>Rank Latest Pull Requests</h2>

        <div class="actions">
            <input
                type="text"
                id="rankLimit"
                placeholder="Limit (default 5)"
                inputmode="numeric"
                pattern="[0-9]*"
                oninput="allowOnlyNumbers(this)"
            />

            <button onclick="rankPRs()">Rank Latest PRs</button>
        </div>
    </section>


    <section class="card">
        <h2>Result</h2>
        <div id="output" class="result-container">
            Waiting for input...
        </div>
    </section>

</div>

<script>

function allowOnlyNumbers(input) {
    input.value = input.value.replace(/[^0-9]/g, "");
}


function disableAllButtons() {
    document.querySelectorAll("button").forEach(btn => {
        btn.disabled = true;
    });
}

function enableAllButtons() {
    document.querySelectorAll("button").forEach(btn => {
        btn.disabled = false;
    });
}

async function analyzeLatest() {
    showLoading();

    try {
        const res = await fetch("/predict/pr/latest");
        const data = await res.json();

        if (!res.ok) {
            document.getElementById("output").innerHTML =
                `<p style="color:red;"><strong>Error:</strong> ${data.detail}</p>`;
            return;
        }

        show(data);
    } catch (err) {
        document.getElementById("output").innerHTML =
            "<p style='color:red;'>Network error occurred.</p>";
    } finally {
        enableAllButtons();
    }
}


async function analyzePR() {
    const pr = document.getElementById("prNumber").value;
    if (!pr) {
        alert("Please enter a PR number");
        return;
    }

    showLoading();

    try {
        const res = await fetch(`/predict/pr/${pr}`);
        const data = await res.json();

        if (!res.ok) {
            document.getElementById("output").innerHTML =
                `<p style="color:red;"><strong>Error:</strong> ${data.detail}</p>`;
            return;
        }

        show(data);
    } catch (err) {
        document.getElementById("output").innerHTML =
            "<p style='color:red;'>Network error occurred.</p>";
    } finally {
        enableAllButtons();
    }
}


async function rankPRs() {
    showLoading();

    const limitInput = document.getElementById("rankLimit").value;
    const url = limitInput
        ? `/rank/prs?limit=${limitInput}`
        : `/rank/prs`;

    try {
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
            document.getElementById("output").innerHTML =
                `<p style="color:red;"><strong>Error:</strong> ${data.detail}</p>`;
            return;
        }

        show(data);
    } catch (err) {
        document.getElementById("output").innerHTML =
            "<p style='color:red;'>Network error occurred.</p>";
    } finally {
        enableAllButtons();
    }
}


function show(data) {
    if (data.detail) {
        document.getElementById("output").innerHTML =
            `<p style="color:red;"><strong>Error:</strong> ${data.detail}</p>`;
        return;
    }

    // Ranking response
    if (data.ranked_pull_requests) {
        renderRanking(data);
        return;
    }

    // Single PR response
    if (data.pr_number) {
        renderSinglePR(data);
        return;
    }

    document.getElementById("output").innerHTML =
        "<p>Unsupported response format</p>";
}

function renderSinglePR(data) {
    const riskClass =
        data.predicted_risk === "HIGH" ? "risk-high" :
        data.predicted_risk === "MEDIUM" ? "risk-medium" :
        "risk-low";

    let html = `
        <h2>
            PR #${data.pr_number}
            <span class="risk-badge ${riskClass}">
                ${data.predicted_risk} RISK
            </span>
        </h2>

        <div class="section">
            <h3>Risk Probabilities</h3>
            ${Object.entries(data.risk_probabilities).map(
                ([k, v]) => `<span class="tag">${k}: ${(v * 100).toFixed(1)}%</span>`
            ).join("")}
        </div>

        <div class="section">
            <h3>Explanation</h3>
            <p><strong>Summary:</strong> ${data.explanation.summary}</p>
            <p><strong>Code Insight:</strong> ${data.explanation.code_complexity_insight}</p>
        </div>

        <div class="section">
            <h3>LLM Review Suggestions</h3>
            <pre class="llm-box">${data.llm_review_suggestions}</pre>
        </div>

        <div class="section">
            <h3>Features Used</h3>
            ${renderTable(data.features_used)}
        </div>

        <div class="section">
            <h3>AST Metrics</h3>
            ${renderTable(data.ast_metrics)}
        </div>
    `;

    document.getElementById("output").innerHTML = html;
}

function renderRanking(data) {
    let rows = data.ranked_pull_requests.map((pr, index) => {
        const riskClass =
            pr.predicted_risk === "HIGH" ? "risk-high" :
            pr.predicted_risk === "MEDIUM" ? "risk-medium" :
            "risk-low";

        return `
            <tr>
                <td>${index + 1}</td>
                <td>#${pr.pr_number}</td>
                <td>
                    <span class="risk-badge ${riskClass}">
                        ${pr.predicted_risk}
                    </span>
                </td>
                <td>${(pr.risk_probability * 100).toFixed(1)}%</td>
            </tr>
        `;
    }).join("");

    document.getElementById("output").innerHTML = `
        <h2>Ranked Pull Requests</h2>
        <p>Total analyzed: ${data.count}</p>

        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>PR Number</th>
                    <th>Risk Level</th>
                    <th>Confidence</th>
                </tr>
            </thead>
            <tbody>
                ${rows}
            </tbody>
        </table>
    `;
}


function renderTable(obj) {
    return `
        <table>
            <tbody>
                ${Object.entries(obj).map(
                    ([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`
                ).join("")}
            </tbody>
        </table>
    `;
}



function showLoading() {
    disableAllButtons();
    document.getElementById("output").innerHTML =
        "<p>Processing request…</p>";
}


</script>

</body>
</html>
